name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run lint는 --fix로 파일을 고치므로, CI에서는 검사만 한다.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit test
        run: npm test -- --ci

      - name: Build
        run: npm run build
